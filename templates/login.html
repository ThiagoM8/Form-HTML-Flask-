<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    <div id="form_frente">
        <h1>Login</h1>
        <form action="/login" id="login" method="post">
            <label for="nome">NOME</label>
            <input type="text" name="nome" id="nome" required placeholder="Digite seu Login"><br><br>
            <label for="senha">SENHA</label>
            <input type="password" name="senha" id="senha" required placeholder="Digite sua Senha"><br><br>
                
            {% set menssagem = get_flashed_messages() %}
                {% if menssagem %}
                    <div class="flash_alerta">
                        {{menssagem[0]}}
                    </div>
                {% endif %}
                
            <button type="submit" id="btn_login">
                <span></span>
                <span></span>
                <span></span>
                <span></span>ENTRAR
            </button>
        </form>
    </div>
</body>
</html>
